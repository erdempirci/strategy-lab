name: Masa (saatlik)

# Runs the trading desk at :17 every hour. Yahoo futures quotes are delayed ~10 min, so
# an hourly US100 bar is only complete a quarter past; crypto bars are long closed by then.
# Vercel Hobby only allows daily crons, so the hourly trigger lives here.
# Repo secrets: DESK_URL (e.g. https://strategy-lab.vercel.app) and CRON_SECRET
# (the same value as the CRON_SECRET environment variable on Vercel).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: desk-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Masayı çalıştır
        env:
          DESK_URL: ${{ secrets.DESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DESK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DESK_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 240 -X POST "${DESK_URL%/}/api/desk/run" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" -d '{}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k: d[k] for k in ("strategies","new_decisions","approved","equity")}); sys.exit(1 if d["errors"] else 0)'
